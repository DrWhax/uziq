[package]
name = "uziq-librespot"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
env_logger = "0.11"
librespot = { version = "=0.8.0", default-features = false, features = ["native-tls", "rodio-backend"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync"] }
